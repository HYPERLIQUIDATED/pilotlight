[package]
name = "pilotlight"
version = "0.2.0"
edition = "2024"

[dependencies]
alloy-consensus = { version = "=2.5.0", default-features = false }
alloy-eips = { version = "=2.5.0", default-features = false }
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["serde"] }
bytes = { version = "=1.12.1", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
jsonrpsee-types = { version = "=0.26.1", default-features = false }
rustls = { version = "=0.23.45", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["raw_value", "std"] }
thiserror = { version = "=2.0.21", default-features = false }
tokio = { version = "=1.53.2", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
url = { version = "=2.5.8", default-features = false }
webpki-roots = { version = "=1.0.9", default-features = false }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
